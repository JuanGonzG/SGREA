spring.application.name=sgrea

# JWT Access Token: configurar mediante variables de entorno; no guardar secretos reales aquí.
app.security.jwt.secret=${SGREA_JWT_SECRET:}
app.security.jwt.access-expiration-ms=${SGREA_JWT_ACCESS_EXPIRATION_MS:900000}
app.security.jwt.refresh-expiration-ms=${SGREA_JWT_REFRESH_EXPIRATION_MS:604800000}
app.security.jwt.cookie-secure=${SGREA_JWT_COOKIE_SECURE:false}

#Thymeleaf
spring.thymeleaf.prefix=classpath:/paginas/
spring.thymeleaf.suffix=.html

# Imágenes de productos: directorio externo y URL pública /uploads/productos/**
app.productos.upload-dir=uploads/productos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

#DataSource MariaDB
spring.datasource.url=jdbc:mariadb://localhost:3306/sgrea?useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

#Pool de conexiones
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

#Hibernate
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
