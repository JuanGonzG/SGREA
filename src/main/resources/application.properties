spring.application.name=sgrea

#Thymeleaf
spring.thymeleaf.prefix=classpath:/paginas/
spring.thymeleaf.suffix=.html

# Imágenes de productos: directorio externo y URL pública /uploads/productos/**
app.productos.upload-dir=uploads/productos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

#DataSource MariaDB
spring.datasource.url=jdbc:mariadb://localhost:3306/sgrea?useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=Garritas777

#Pool de conexiones
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

#Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
