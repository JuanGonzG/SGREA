<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="es"
      th:fragment="page(pageTitle, code, heading, message, icon)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title th:text="${pageTitle}">SGREA | Error</title>
    <link rel="stylesheet" th:href="@{/css/adminlte.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/error.css}">
</head>
<body class="error-page">
<main class="error-card card" role="main">
    <div class="card-body text-center p-4 p-md-5">
        <img th:src="@{/img/logo.png}" class="error-logo mb-4" alt="SGREA">
        <div class="error-icon" aria-hidden="true">
            <i th:class="|bi ${icon}|"></i>
        </div>
        <div class="error-code mt-3" th:text="${code}">500</div>
        <h1 class="h4 mt-3" th:text="${heading}">Ocurrió un error</h1>
        <p class="text-muted mb-4" th:text="${message}">
            No fue posible completar la solicitud.
        </p>
        <a th:href="@{/}" class="btn btn-primary">
            <i class="bi bi-house me-1" aria-hidden="true"></i>Ir al inicio
        </a>
        <p class="small text-muted mt-4 mb-0">SGREA · Sistema de Gestión de Recursos y Almacenes</p>
    </div>
</main>
</body>
</html>
