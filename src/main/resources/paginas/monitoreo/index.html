<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{master :: layout(~{::main}, 'SGREA | Monitoreo')}">

<main class="app-main">
    <style>
        .monitoreo-detail-placeholder {
            min-height: 8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--bs-secondary-color);
            background-color: var(--bs-tertiary-bg);
            border: 1px dashed var(--bs-border-color);
            border-radius: .375rem;
            text-align: center;
        }

        .monitoreo-table-container {
            width: 100%;
            min-height: 8rem;
        }
    </style>

    <div class="app-content-header">
        <div class="container-fluid">
            <div class="d-flex flex-wrap gap-2 align-items-center justify-content-between">
                <div>
                    <h1 class="mb-0 fs-3">Monitoreo operativo</h1>
                    <small class="text-muted">Seguimiento de Surtido y Recepción en tiempo casi real.</small>
                </div>
                <span class="badge text-bg-secondary">
                    <i class="bi bi-eye me-1"></i> Solo lectura
                </span>
            </div>
        </div>
    </div>

    <div class="app-content">
        <div class="container-fluid">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                <div class="text-muted small">
                    Última actualización: <span id="monitoreoUltimaActualizacion">Pendiente</span>
                </div>
                <button id="btnActualizarMonitoreo" type="button" class="btn btn-outline-primary">
                    <i class="bi bi-arrow-clockwise me-1"></i> Actualizar
                </button>
            </div>

            <ul class="nav nav-tabs" id="tabsMonitoreo" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="tabSurtidos" data-bs-toggle="tab"
                            data-bs-target="#panelSurtidos" type="button" role="tab"
                            aria-controls="panelSurtidos" aria-selected="true">
                        <i class="bi bi-box-seam me-1"></i> Surtidos activos
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="tabRecepciones" data-bs-toggle="tab"
                            data-bs-target="#panelRecepciones" type="button" role="tab"
                            aria-controls="panelRecepciones" aria-selected="false">
                        <i class="bi bi-box-arrow-in-down me-1"></i> Recepciones activas
                    </button>
                </li>
            </ul>

            <div class="tab-content border border-top-0 rounded-bottom bg-body p-3">
                <section class="tab-pane fade show active" id="panelSurtidos" role="tabpanel"
                         aria-labelledby="tabSurtidos" tabindex="0">
                    <div id="tablaMonitoreoSurtidos" class="monitoreo-table-container">
                        Cargando surtidos activos...
                    </div>
                </section>
                <section class="tab-pane fade" id="panelRecepciones" role="tabpanel"
                         aria-labelledby="tabRecepciones" tabindex="0">
                    <div id="tablaMonitoreoRecepciones" class="monitoreo-table-container">
                        Cargando recepciones activas...
                    </div>
                </section>
            </div>
        </div>
    </div>
    <script th:src="@{/js/sgrea/monitoreo.js(v=2)}"></script>
</main>
</html>
