<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{master :: layout(~{::main}, 'SGREA | Productos')}">

<main class="app-main">
    <style>
        #tablaProductos .tabulator-row {
            cursor: pointer;
        }
    </style>
    <div class="app-content-header">
        <div class="container-fluid">
            <h1 class="mb-0 fs-3">Productos</h1>
        </div>
    </div>

    <div class="app-content">
        <div class="container-fluid">
            <!-- Contenido -->
            <div class="card">
                <div class="card-header">
                    <div class="row align-items-center">
                        <div class="col-12 text-end">
                            <button type="button"
                                    id="btnNuevoProducto"
                                    class="btn btn-primary"
                                    th:data-id-usuario="${session.idUsuario}"
                                    th:data-id-bodega="${session.idBodega}"
                                    onclick="nuevoProducto(this)">
                                <i class="bi bi-plus-lg"></i>
                                Nuevo producto
                            </button>
                        </div>
                    </div>
                </div>

                <div class="card-body p-0">
                    <div id="tablaProductos"
                         class="p-3"
                         th:data-id-usuario="${session.idUsuario}"
                         th:data-id-bodega="${session.idBodega}">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalProducto" tabindex="-1" aria-labelledby="modalProductoLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalProductoLabel">
                        Nuevo producto
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>

                <form id="formProducto" class="needs-validation" autocomplete="off" novalidate>
                    <div class="modal-body">
                        <input type="hidden" id="idProducto" name="idProducto">
                        <div class="row">
                            <div class="col-md-8 mb-3 position-relative">
                                <label for="nombre" class="form-label">Nombre:</label>
                                <input type="text" class="form-control" id="nombre" name="nombre" minlength="10" maxlength="100" required>
                                <div class="invalid-feedback">
                                    Captura un nombre de entre 10 y 100 caracteres.
                                </div>
                            </div>
                            <div class="col-md-4 mb-3 position-relative">
                                <label for="bodega" class="form-label">Bodega:</label>
                                <select class="form-select" id="bodega" name="bodega" required disabled></select>
                                <div class="invalid-feedback">
                                    Selecciona una bodega.
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-7">
                                <div class="row">
                                    <div class="col mb-3 position-relative">
                                        <label for="descripcion" class="form-label">Descripción:</label>
                                        <textarea class="form-control" id="descripcion" name="descripcion" rows="6" required></textarea>
                                        <div class="invalid-feedback">
                                            Captura una descripción.
                                        </div>
                                    </div>
                                </div>
                                <div class="row mt-3">
                                    <div class="col mb-3 position-relative">
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" id="activo" name="activo" checked>
                                            <label class="form-check-label" for="activo">
                                                Producto activo
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-5 mb-3 position-relative">
                                <label for="imagen" class="form-label">Imagen:</label>
                                <div id="vistaPreviaImagen" class="d-none">
                                    <img id="imagenProductoPreview" class="img-thumbnail" alt="Vista previa de la imagen del producto" style="max-height: 180px;">
                                </div>
                                <input type="file" class="mt-3 form-control" id="imagen" name="imagen" accept="image/png,image/jpeg,image/webp">
                                <div class="invalid-tooltip">
                                    Selecciona una imagen o conserva la imagen existente del producto.
                                </div>
                                <div class="form-text">Formatos permitidos: PNG, JPG y WEBP. Máximo 5 MB.</div>

                            </div>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            Cancelar
                        </button>

                        <button type="button" onclick="guardarProducto()" class="btn btn-primary">
                            <i class="bi bi-save"></i>
                            Guardar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script th:inline="javascript">
        const productosIniciales = /*[[${productos}]]*/ [];
    </script>
    <script th:src="@{/js/sgrea/productos.js}"></script>
</main>
</html>
