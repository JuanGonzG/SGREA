<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{master :: layout(~{::main}, 'SGREA | Reportes')}">

<main class="app-main">
    <div class="app-content-header">
        <div class="container-fluid">
            <div class="d-flex flex-wrap gap-2 align-items-center justify-content-between">
                <div>
                    <h1 class="mb-0 fs-3">Reportes</h1>
                    <p class="text-muted mb-0">Consultas históricas de la operación.</p>
                </div>
                <span class="badge text-bg-secondary">
                    <i class="bi bi-building me-1"></i>
                    <span th:text="${session.nombreBodega}">Bodega activa</span>
                </span>
            </div>
        </div>
    </div>

    <div class="app-content">
        <div class="container-fluid">
            <ul class="nav nav-tabs" id="tabsReportes" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="tabHojas" data-bs-toggle="tab" data-bs-target="#panelHojas"
                            type="button" role="tab" aria-controls="panelHojas" aria-selected="true">Hojas</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="tabMovimientos" data-bs-toggle="tab" data-bs-target="#panelMovimientos"
                            type="button" role="tab" aria-controls="panelMovimientos" aria-selected="false">Movimientos</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="tabContenedores" data-bs-toggle="tab" data-bs-target="#panelContenedores"
                            type="button" role="tab" aria-controls="panelContenedores" aria-selected="false">Contenedores</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="tabInventario" data-bs-toggle="tab" data-bs-target="#panelInventario"
                            type="button" role="tab" aria-controls="panelInventario" aria-selected="false">Inventario</button>
                </li>
            </ul>

            <div class="tab-content border border-top-0 rounded-bottom bg-body p-3">
                <section class="tab-pane fade show active" id="panelHojas" role="tabpanel" aria-labelledby="tabHojas">
                    <form id="filtrosHojas" class="row g-3 mb-3" novalidate>
                        <div class="col-12 col-md-6 col-xl-2"><label for="hojasFechaDesde" class="form-label">Salida desde</label><input id="hojasFechaDesde" name="fechaDesde" type="date" class="form-control"></div>
                        <div class="col-12 col-md-6 col-xl-2"><label for="hojasFechaHasta" class="form-label">Salida hasta</label><input id="hojasFechaHasta" name="fechaHasta" type="date" class="form-control"></div>
                        <div class="col-12 col-md-6 col-xl-2"><label for="hojasIdEstado" class="form-label">Estado</label><select id="hojasIdEstado" name="idEstado" class="form-select"><option value="">Todos</option><option value="1">Creada</option><option value="2">Por surtir</option><option value="3">Surtiendo</option><option value="4">En llamado</option><option value="5">Recibiendo</option><option value="6">Completado</option></select></div>
                        <div class="col-12 col-md-6 col-xl-2"><label for="hojasCliente" class="form-label">Cliente</label><input id="hojasCliente" name="cliente" type="text" class="form-control"></div>
                        <div class="col-12 col-md-6 col-xl-2"><label for="hojasProyecto" class="form-label">Proyecto</label><input id="hojasProyecto" name="proyecto" type="text" class="form-control"></div>
                        <div class="col-12 col-xl-2 d-flex align-items-end gap-2"><button class="btn btn-primary flex-grow-1" type="submit">Buscar</button><button class="btn btn-outline-secondary" type="button" data-limpiar="filtrosHojas">Limpiar</button><button class="btn btn-outline-success" type="button" data-export-excel="hojas" title="Exportar Excel"><i class="bi bi-file-earmark-excel me-1"></i>Excel</button></div>
                    </form>
                    <div class="table-responsive"><div id="tablaReportesHojas"></div></div>
                </section>

                <section class="tab-pane fade" id="panelMovimientos" role="tabpanel" aria-labelledby="tabMovimientos">
                    <form id="filtrosMovimientos" class="row g-3 mb-3" novalidate>
                        <div class="col-12 col-md-6 col-xl-2"><label for="movFechaDesde" class="form-label">Desde</label><input id="movFechaDesde" name="fechaDesde" type="date" class="form-control"></div>
                        <div class="col-12 col-md-6 col-xl-2"><label for="movFechaHasta" class="form-label">Hasta</label><input id="movFechaHasta" name="fechaHasta" type="date" class="form-control"></div>
                        <div class="col-12 col-md-6 col-xl-2"><label for="movTipo" class="form-label">Tipo</label><select id="movTipo" name="idTipoMovimiento" class="form-select"><option value="">Todos</option><option value="1">Salida</option><option value="2">Entrada</option></select></div>
                        <div class="col-12 col-md-6 col-xl-2"><label for="movHoja" class="form-label">Hoja</label><input id="movHoja" name="idHoja" type="number" min="1" class="form-control"></div>
                        <div class="col-12 col-md-6 col-xl-2"><label for="movConjunto" class="form-label">Código de Conjunto</label><input id="movConjunto" name="codigoConjunto" type="text" class="form-control"></div>
                        <div class="col-12 col-md-6 col-xl-2"><label for="movUsuario" class="form-label">Usuario</label><input id="movUsuario" name="idUsuario" type="number" min="1" class="form-control"></div>
                        <div class="col-12 d-flex justify-content-end gap-2"><button class="btn btn-primary" type="submit">Buscar</button><button class="btn btn-outline-secondary" type="button" data-limpiar="filtrosMovimientos">Limpiar</button><button class="btn btn-outline-success" type="button" data-export-excel="movimientos" title="Exportar Excel"><i class="bi bi-file-earmark-excel me-1"></i>Excel</button></div>
                    </form>
                    <div class="table-responsive"><div id="tablaReportesMovimientos"></div></div>
                </section>

                <section class="tab-pane fade" id="panelContenedores" role="tabpanel" aria-labelledby="tabContenedores">
                    <form id="filtrosContenedores" class="row g-3 mb-3" novalidate>
                        <div class="col-12 col-md-6 col-xl-3"><label for="contFechaDesde" class="form-label">Desde</label><input id="contFechaDesde" name="fechaDesde" type="date" class="form-control"></div>
                        <div class="col-12 col-md-6 col-xl-3"><label for="contFechaHasta" class="form-label">Hasta</label><input id="contFechaHasta" name="fechaHasta" type="date" class="form-control"></div>
                        <div class="col-12 col-md-6 col-xl-3"><label for="contCodigo" class="form-label">Código de Contenedor</label><input id="contCodigo" name="codigoContenedor" type="text" class="form-control"></div>
                        <div class="col-12 col-md-6 col-xl-3"><label for="contHoja" class="form-label">Hoja</label><input id="contHoja" name="idHoja" type="number" min="1" class="form-control"></div>
                        <div class="col-12 d-flex justify-content-end gap-2"><button class="btn btn-primary" type="submit">Buscar</button><button class="btn btn-outline-secondary" type="button" data-limpiar="filtrosContenedores">Limpiar</button><button class="btn btn-outline-success" type="button" data-export-excel="contenedores" title="Exportar Excel"><i class="bi bi-file-earmark-excel me-1"></i>Excel</button></div>
                    </form>
                    <div class="table-responsive"><div id="tablaReportesContenedores"></div></div>
                </section>

                <section class="tab-pane fade" id="panelInventario" role="tabpanel" aria-labelledby="tabInventario">
                    <form id="filtrosInventario" class="row g-3 mb-3" novalidate>
                        <div class="col-12 col-md-4"><label for="invProducto" class="form-label">Producto</label><input id="invProducto" name="idProducto" type="number" min="1" class="form-control"></div>
                        <div class="col-12 col-md-4"><label for="invEstado" class="form-label">Estado del Conjunto</label><select id="invEstado" name="idEstadoConjunto" class="form-select"><option value="">Todos</option><option value="1">Disponible</option><option value="2">Surtido</option><option value="3">Mantenimiento</option><option value="4">Fuera de servicio</option></select></div>
                        <div class="col-12 col-md-4"><label for="invConjunto" class="form-label">Código de Conjunto</label><input id="invConjunto" name="codigoConjunto" type="text" class="form-control"></div>
                        <div class="col-12 d-flex justify-content-end gap-2"><button class="btn btn-primary" type="submit">Buscar</button><button class="btn btn-outline-secondary" type="button" data-limpiar="filtrosInventario">Limpiar</button><button class="btn btn-outline-success" type="button" data-export-excel="inventario" title="Exportar Excel"><i class="bi bi-file-earmark-excel me-1"></i>Excel</button></div>
                    </form>
                    <div class="table-responsive"><div id="tablaReportesInventario"></div></div>
                </section>
            </div>
        </div>
    </div>
    <script th:src="@{/js/reportes/exportaciones.js}"></script>
    <script th:src="@{/js/reportes/reportes.js}"></script>
</main>
</html>
